<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patches Shop · Parches personalizados</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Patches Shop</h1>
    <button id="cart-toggle" class="btn">Carrito (<span id="cart-count">0</span>)</button>
  </header>

  <main class="layout">
    <section>
      <div class="filters">
        <input id="search" type="search" placeholder="Buscar parches...">
        <select id="category-filter"><option value="">Todas las categorías</option></select>
      </div>
      <div id="product-grid" class="grid"></div>
    </section>

    <aside id="cart-panel" class="cart hidden">
      <h2>Tu pedido</h2>
      <ul id="cart-items"></ul>
      <p class="total">Total: <strong id="cart-total">$0.00</strong></p>
      <form id="checkout-form">
        <input name="customer_name" placeholder="Nombre completo" required minlength="2">
        <input name="customer_email" type="email" placeholder="Email" required>
        <input name="shipping_address" placeholder="Dirección de envío" required minlength="5">
        <button class="btn primary" type="submit">Confirmar pedido</button>
      </form>
      <p id="message" role="status"></p>
    </aside>
  </main>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>

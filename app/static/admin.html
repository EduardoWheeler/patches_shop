<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administración · Patches Shop</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
  <header class="topbar">
    <h1>Panel de administración</h1>
    <div><a class="btn" href="/">Ver tienda</a> <button id="logout" class="btn hidden">Salir</button></div>
  </header>

  <main class="admin">
    <section id="login-view">
      <form id="login-form" class="panel narrow">
        <h2>Iniciar sesión</h2>
        <input name="email" type="email" placeholder="Email" required autocomplete="username">
        <input name="password" type="password" placeholder="Contraseña" required autocomplete="current-password">
        <button class="btn primary" type="submit">Entrar</button>
        <p id="login-msg" class="error"></p>
      </form>
    </section>

    <section id="app-view" class="hidden">
      <nav class="tabs">
        <button class="btn active" data-tab="products">Productos</button>
        <button class="btn" data-tab="categories">Categorías</button>
        <button class="btn" data-tab="orders">Pedidos</button>
      </nav>
      <p id="admin-msg" role="status"></p>

      <div id="tab-products" class="tab">
        <form id="product-form" class="panel form-grid">
          <h2 id="product-form-title">Nuevo producto</h2>
          <input name="name" placeholder="Nombre" required maxlength="150">
          <select name="category_id" required></select>
          <input name="price" type="number" step="0.01" min="0.01" placeholder="Precio" required>
          <input name="stock" type="number" min="0" placeholder="Stock" required>
          <input name="size" placeholder="Tamaño (ej. 7 cm)" maxlength="50">
          <textarea name="description" placeholder="Descripción" rows="2"></textarea>
          <label>Imagen (PNG, JPG o WEBP, máx. 2 MB)
            <input name="image" type="file" accept="image/png,image/jpeg,image/webp">
          </label>
          <img id="image-preview" class="thumb hidden" alt="Imagen actual">
          <div>
            <button class="btn primary" type="submit">Guardar</button>
            <button class="btn" type="button" id="product-cancel">Cancelar edición</button>
          </div>
        </form>
        <div class="table-wrap"><table id="products-table"></table></div>
      </div>

      <div id="tab-categories" class="tab hidden">
        <form id="category-form" class="panel form-grid">
          <h2>Nueva categoría</h2>
          <input name="name" placeholder="Nombre" required maxlength="100">
          <input name="slug" placeholder="Slug (opcional, se genera solo)" maxlength="120">
          <div><button class="btn primary" type="submit">Crear</button></div>
        </form>
        <ul id="categories-list" class="panel"></ul>
      </div>

      <div id="tab-orders" class="tab hidden">
        <div class="table-wrap"><table id="orders-table"></table></div>
      </div>
    </section>
  </main>

  <script src="/static/js/admin.js"></script>
</body>
</html>
